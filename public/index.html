<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gogram Session Forge</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="session.css" />
  <script src="wasm_exec.js"></script>
</head>
<body class="page-generator">
  <div class="shell">
    <section class="hero">
      <div class="hero-switch fade-in">
        <a class="chip-link" href="check.html">Go to Check</a>
        <button id="themeToggle" class="toggle-btn" type="button" aria-label="Toggle theme">
          <svg class="theme-icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.8"></circle>
            <path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"></path>
          </svg>
        </button>
      </div>
      <div class="hero-copy fade-in">
        <div class="hero-kicker">
          <span>Local wasm</span>
          <span>•</span>
          <span>Private</span>
        </div>
        <h1>Session forge.</h1>
        <p class="hero-note">Runs fully in your browser. No server, no uploads, no session storage outside your device.</p>
      </div>
    </section>

    <main class="layout">
      <section class="panel fade-in fade-in-delay-2">
        <div class="panel-head">
          <div class="panel-title">
            <div>
              <h2>Generator</h2>
            </div>
          </div>
        </div>

        <div class="panel-body stack">
          <div class="form">
            <div class="field">
              <label for="appId"><span>App ID</span><span class="tag">optional</span></label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 4h7l5 5v11H7z"></path>
                    <path d="M14 4v6h6"></path>
                  </svg>
                </span>
                <input type="text" id="appId" placeholder="Optional" autocomplete="off" />
              </div>
            </div>

            <div class="field">
              <label for="appHash"><span>App Hash</span><span class="tag">optional</span></label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 4 6 20"></path>
                    <path d="M18 4 16 20"></path>
                    <path d="M4 9h16"></path>
                    <path d="M3 15h16"></path>
                  </svg>
                </span>
                <input type="text" id="appHash" placeholder="Optional" autocomplete="off" />
              </div>
            </div>

            <div class="field">
              <label for="phoneNumber"><span>Phone</span><span class="tag">session</span></label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6.8 3.6h10.4A2.2 2.2 0 0 1 19.4 5.8v12.4a2.2 2.2 0 0 1-2.2 2.2H6.8A2.2 2.2 0 0 1 4.6 18.2V5.8A2.2 2.2 0 0 1 6.8 3.6Z"></path>
                    <path d="M9 17h6"></path>
                  </svg>
                </span>
                <input type="tel" id="phoneNumber" placeholder="+1234567890" autocomplete="off" />
              </div>
            </div>

            <div class="field">
              <label for="botToken"><span>Bot Token</span><span class="tag">alt</span></label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="10" width="16" height="10" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                  </svg>
                </span>
                <input type="password" id="botToken" placeholder="Bot token" autocomplete="off" />
              </div>
            </div>

            <div class="field">
              <label for="dcId"><span>DC</span><span class="tag">5</span></label>
              <div class="input-shell select-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="8.5"></circle>
                    <path d="M3.5 12h17"></path>
                  </svg>
                </span>
                <select id="dcId">
                  <option value="1">DC 1</option>
                  <option value="2">DC 2</option>
                  <option value="3">DC 3</option>
                  <option value="4">DC 4</option>
                  <option value="5" selected>DC 5</option>
                </select>
              </div>
            </div>
          </div>

          <div class="toolbar">
            <button id="sendCodeBtn" class="action-btn" type="button">
              <span class="btn-label">Send Code</span>
              <span class="spinner hidden"></span>
            </button>
            <button id="verifyBtn" class="ghost-btn hidden" type="button">
              <span class="btn-label">Generate</span>
              <span class="spinner hidden"></span>
            </button>
            <button id="resetBtn" class="pill-btn hidden" type="button">Reset</button>
          </div>

          <div id="codeGroup" class="panel-card hidden">
            <div class="field">
              <label for="verificationCode"><span>Code</span><span class="tag">otp</span></label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2 3 7v10l9 5 9-5V7z"></path>
                    <path d="M12 22V12"></path>
                    <path d="m3 7 9 5 9-5"></path>
                  </svg>
                </span>
                <input type="text" id="verificationCode" placeholder="Code" autocomplete="off" />
              </div>
            </div>
            <div class="dual-actions">
              <button id="sendVerification" class="ghost-btn tiny-btn" type="button">Use Code</button>
            </div>
          </div>

          <div id="passwordGroup" class="panel-card hidden">
            <div class="field">
              <label for="password"><span>Password</span><span class="tag">2fa</span></label>
              <div class="input-shell">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3.5"></circle>
                    <path d="M12 2v4"></path>
                    <path d="M12 18v4"></path>
                    <path d="M2 12h4"></path>
                    <path d="M18 12h4"></path>
                  </svg>
                </span>
                <input type="password" id="password" placeholder="Password" autocomplete="off" />
              </div>
            </div>
            <div class="dual-actions">
              <button id="sendPassword" class="ghost-btn tiny-btn" type="button">Use Password</button>
            </div>
          </div>
        </div>
      </section>

      <aside class="rail fade-in fade-in-delay-3">
        <div class="terminal-card">
          <div class="terminal-top">
            <div class="dots" aria-hidden="true">
              <span class="dot red"></span>
              <span class="dot amber"></span>
              <span class="dot green"></span>
            </div>
            <span class="terminal-label">logs</span>
          </div>
          <div id="outputArea" class="console" aria-live="polite"></div>
          <div class="terminal-actions">
            <button id="showConsoleBtn" class="pill-btn tiny-btn" type="button">Console</button>
            <button id="clearOutputBtn" class="pill-btn tiny-btn" type="button">Clear</button>
          </div>
          <div class="mini-note terminal-note">Status: <span id="statusText">idle</span></div>
        </div>
      </aside>
    </main>

  </div>

  <script type="module" src="session.js"></script>
</body>
</html>
